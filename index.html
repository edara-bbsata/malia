<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071F2B">
<meta name="description" content="اختبار تدريبي تفاعلي في الإدارة المالية - الإدارة ببساطة">
<title>اختبار الإدارة المالية | الإدارة ببساطة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#071F2B;
  --navy2:#0B3440;
  --navy3:#124957;
  --teal:#12B8A6;
  --teal-dark:#078F83;
  --mint:#B8F1E7;
  --mint-light:#E8FAF6;
  --ink:#153640;
  --muted:#668087;
  --line:#D7EAE7;
  --white:#FFFFFF;
  --bg:#F2F9F8;
  --red:#D94D5C;
  --green:#078B70;
  --amber:#F2B705;
  --shadow:0 14px 38px rgba(7,31,43,.08);
  --font-ar:"IBM Plex Sans Arabic",sans-serif;
  --font-en:"Inter",sans-serif;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth;direction:rtl}

body{
  margin:0;
  font-family:var(--font-ar);
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,rgba(18,184,166,.07),transparent 24%),
    radial-gradient(circle at 95% 80%,rgba(18,184,166,.045),transparent 26%),
    var(--bg);
  min-height:100vh;
  line-height:1.8;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  /* منع النسخ والتحديد */
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

/* نسمح بالكتابة في حقل الاسم فقط */
input, textarea { user-select:text; -webkit-user-select:text; }

/* منع سحب الصور */
img { -webkit-user-drag:none; pointer-events:none; }

button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,calc(100% - 36px));margin:auto}
h1,h2,h3,h4,p{margin-top:0}

button:focus-visible,input:focus-visible{
  outline:3px solid rgba(18,184,166,.55);
  outline-offset:3px;
}

[dir="ltr"],.english,.timer,.score-value,.question-number,
.stat strong,.result-stat b,.brand-sub,.eyebrow{
  font-family:var(--font-en),var(--font-ar);
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

/* HEADER */
.header{
  min-height:86px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:13px}
.brand img{
  width:56px;height:56px;
  object-fit:contain;
  background:white;
  border-radius:15px;
  padding:3px;
  box-shadow:0 6px 18px rgba(7,31,43,.10);
}
.brand-name{
  font-size:21px;
  font-weight:800;
  color:var(--navy);
  line-height:1.5;
}
.brand-sub{
  display:block;
  font-size:9px;
  font-weight:800;
  color:var(--teal-dark);
  letter-spacing:1.7px;
  margin-top:2px;
  text-align:right;
}
.header-tag{
  font-size:12px;
  font-weight:800;
  color:var(--navy2);
  background:#E8F6F3;
  border:1px solid #D4ECE6;
  border-radius:30px;
  padding:9px 15px;
  white-space:nowrap;
}

/* INTRO HERO */
.hero{
  position:relative;
  overflow:hidden;
  min-height:465px;
  border-radius:28px;
  color:white;
  background:
    radial-gradient(ellipse at 17% 18%,rgba(18,184,166,.25),transparent 36%),
    radial-gradient(ellipse at 90% 90%,rgba(18,184,166,.10),transparent 30%),
    linear-gradient(120deg,#071F2B 0%,#0A303C 62%,#10434A 100%);
  box-shadow:0 25px 70px rgba(7,31,43,.16);
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);
  align-items:center;
  gap:30px;
  padding:52px 60px;
}
.hero:before{
  content:"";
  position:absolute;
  width:480px;height:480px;
  border:1px solid rgba(184,241,231,.10);
  border-radius:50%;
  left:-180px;bottom:-280px;
  box-shadow:0 0 0 35px rgba(184,241,231,.025),
             0 0 0 75px rgba(184,241,231,.02);
}
.hero-content{position:relative;z-index:2;min-width:0}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:#8BE6D9;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.8px;
  direction:ltr;
}
.eyebrow:before{
  content:"";
  width:25px;height:2px;
  background:var(--teal);
}
.hero h1{
  font-size:clamp(42px,5vw,66px);
  line-height:1.4;
  margin:20px 0 10px;
  font-weight:800;
  letter-spacing:-1px;
}
.hero h1 span{color:#70DECF}

.hero-description{
  max-width:590px;
  color:#E0EEEE;
  font-size:18px;
  font-weight:700;
  line-height:2.25;
  margin:18px 0 24px;
}
.hero-description strong{
  color:#8BE6D9;
  font-weight:800;
}

.student-field{max-width:440px;margin-top:28px}
.student-field label{
  display:block;
  font-size:14px;
  font-weight:800;
  color:#E0EEEE;
  margin-bottom:9px;
}
.student-field input{
  width:100%;
  height:56px;
  border-radius:13px;
  padding:0 16px;
  background:#fff;
  color:var(--ink);
  border:2px solid transparent;
  outline:none;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}
.student-field input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 4px rgba(18,184,166,.22);
}
.start-btn{
  width:100%;
  height:58px;
  margin-top:12px;
  border:0;
  border-radius:13px;
  color:#062A32;
  background:linear-gradient(110deg,#9AF0E3,#12B8A6);
  font-weight:800;
  font-size:17px;
  box-shadow:0 10px 28px rgba(18,184,166,.25);
  transition:.2s;
}
.start-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.04);
}
.hero-note{
  font-size:12px;
  color:#C0D5D8;
  line-height:1.9;
  margin-top:14px;
  font-weight:700;
}

/* HERO ART */
.hero-art{
  position:relative;
  min-height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
  direction:ltr;
}
.art-orbit{
  width:300px;height:300px;
  border-radius:50%;
  border:1px solid rgba(130,225,211,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 0 0 25px rgba(130,225,211,.025),
             0 0 0 55px rgba(130,225,211,.018);
}
.art-core{
  width:190px;height:190px;
  border-radius:32px;
  transform:rotate(-8deg);
  background:linear-gradient(145deg,#164B55,#0D303B);
  border:1px solid rgba(130,225,211,.34);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 25px 55px #0004;
}
.art-core svg{width:125px;height:125px}
.float-card{
  position:absolute;
  background:#F9FFFF;
  color:var(--navy);
  border-radius:13px;
  padding:12px 16px;
  box-shadow:0 14px 35px #0003;
  font-size:12px;
  font-weight:800;
  direction:rtl;
}
.float-card b{
  display:block;
  color:var(--teal-dark);
  font-family:var(--font-en);
  font-size:19px;
  font-weight:800;
  margin-bottom:3px;
}
.float-one{top:25px;right:-4px}
.float-two{bottom:35px;left:-3px}
.float-three{
  bottom:8px;
  right:35px;
  background:#123D47;
  color:#D9F6F0;
  border:1px solid #3B7075;
  font-family:var(--font-en);
  font-size:10px;
  letter-spacing:.5px;
  direction:ltr;
}

/* EXAM */
#exam,#result{display:none}

.exam-top{
  position:sticky;
  top:10px;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid #CFE9E4;
  border-radius:20px;
  padding:17px 22px;
  margin:20px 0;
  box-shadow:var(--shadow);
}
.exam-brand{display:flex;align-items:center;gap:12px}
.exam-brand img{width:45px;height:45px;object-fit:contain}
.exam-brand strong{
  display:block;
  font-size:16px;
  font-weight:800;
  color:var(--navy);
}
.exam-brand small{
  display:block;
  font-family:var(--font-en);
  font-size:9px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:1px;
  direction:ltr;
}

/* TIMER (مكبّر) */
.timer-box{
  min-width:310px;
  text-align:center;
  padding:14px 32px 16px;
  border:1px solid rgba(18,184,166,.34);
  border-radius:18px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(18,184,166,.17),transparent 72%),
    linear-gradient(145deg,#F2FFFC,#E5F8F4);
  box-shadow:
    0 0 0 4px rgba(18,184,166,.055),
    0 8px 24px rgba(7,31,43,.07),
    0 0 28px rgba(18,184,166,.13);
}
.timer-label{
  font-size:14px;
  color:#42666B;
  font-weight:800;
  margin-bottom:0;
  letter-spacing:.2px;
}
.timer{
  font-size:clamp(64px,8vw,94px);
  font-weight:800;
  line-height:1.15;
  color:var(--navy);
  direction:ltr;
  letter-spacing:2px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(18,184,166,.10);
  white-space:nowrap;
}
.timer.warning{
  color:#C72F43;
  animation:timerPulse .8s infinite;
  text-shadow:0 0 18px rgba(217,77,92,.20);
}
.timer-box.urgent{
  border-color:rgba(217,77,92,.5);
  background:linear-gradient(145deg,#FFF5F5,#FFE8EA);
  box-shadow:0 0 0 4px rgba(217,77,92,.07),
             0 8px 24px rgba(7,31,43,.07);
}
.timer-box.urgent .timer-label{color:#A93B49}
@keyframes timerPulse{50%{opacity:.72}}

.timebar{
  height:6px;
  background:#E8EFF0;
  border-radius:6px;
  overflow:hidden;
  margin-top:8px;
}
.timebar-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#078F83,#12B8A6);
  border-radius:6px;
  transition:width 1s linear;
}

.student-strip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:25px 2px 12px;
  font-size:14px;
  color:#526C74;
  font-weight:700;
}
.student-strip strong{color:var(--navy);font-weight:800}

.progress-track{
  height:9px;
  background:#DFECEA;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px;
}
.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#078F83,#12B8A6,#72E1D2);
  border-radius:20px;
  transition:width .3s;
}

.exam-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 235px;
  gap:18px;
  align-items:start;
}

/* QUESTION CARD */
.question-card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 100% 0%,rgba(18,184,166,.15),transparent 42%),
    radial-gradient(ellipse at 0% 100%,rgba(184,241,231,.42),transparent 45%),
    linear-gradient(145deg,#FFFFFF 0%,#F5FFFC 55%,#EFFAF8 100%);
  border:1px solid #8DDCCD;
  border-radius:23px;
  padding:36px;
  min-height:390px;
  box-shadow:
    0 13px 36px rgba(7,31,43,.075),
    0 0 0 4px rgba(18,184,166,.075),
    0 0 32px rgba(18,184,166,.17);
  transition:box-shadow .25s,border-color .25s;
}
.question-card:before,.question-card:after{
  content:"";
  position:absolute;
  z-index:-1;
  border-radius:50%;
  pointer-events:none;
  filter:blur(38px);
}
.question-card:before{
  width:230px;height:230px;
  background:rgba(18,184,166,.09);
  top:-115px;left:-70px;
}
.question-card:after{
  width:190px;height:190px;
  background:rgba(184,241,231,.34);
  bottom:-110px;right:-70px;
}
.question-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.question-label{
  color:#087F76;
  background:linear-gradient(120deg,#DDF8F1,#C9F1E8);
  border:1px solid #B7E8DC;
  border-radius:30px;
  padding:8px 15px;
  font-size:13px;
  font-weight:800;
}
.question-number{
  min-width:82px;
  text-align:center;
  padding:7px 13px;
  border-radius:11px;
  background:var(--navy);
  color:#FFFFFF;
  border:1px solid #174B57;
  font-size:14px;
  font-weight:800;
  direction:ltr;
  box-shadow:0 5px 14px rgba(7,31,43,.16);
}

.flag-btn{
  background:#F3FAF8;
  border:1px solid #CFE7E2;
  border-radius:9px;
  padding:7px 12px;
  font-size:12px;
  font-weight:800;
  color:#42666B;
  transition:.15s;
}
.flag-btn:hover{background:#E8F6F3}
.flag-btn.active{
  background:#FFF4D6;
  border-color:var(--amber);
  color:#8A6D00;
}

.question-text{
  font-size:clamp(20px,2.3vw,25px);
  line-height:2;
  font-weight:800;
  color:var(--navy);
  margin:0 0 27px;
  letter-spacing:-.3px;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.option{
  display:flex;
  align-items:center;
  gap:13px;
  text-align:right;
  min-height:68px;
  padding:13px 15px;
  border:1px solid #CFE7E2;
  border-radius:14px;
  background:rgba(255,255,255,.92);
  color:#173D46;
  font-size:15px;
  font-weight:700;
  line-height:1.9;
  transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;
  box-shadow:0 3px 10px rgba(7,31,43,.035);
}
.option:hover{
  border-color:#65D2C2;
  background:#F0FCF8;
  transform:translateY(-2px);
  box-shadow:0 7px 18px rgba(18,184,166,.14);
}
.option.selected{
  border:2px solid var(--teal-dark);
  background:linear-gradient(120deg,#DDF8F1,#EAFBF7);
  color:#073D42;
  box-shadow:0 0 0 3px rgba(18,184,166,.14),
             0 7px 22px rgba(18,184,166,.18);
}
.option-letter{
  flex-shrink:0;
  width:38px;height:38px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#E5F2EF;
  color:#315D61;
  font-weight:800;
  font-size:16px;
  transition:.18s;
}
.option.selected .option-letter{
  background:var(--teal-dark);
  color:white;
}

/* SIDEBAR */
.exam-sidebar{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}
.sidebar-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:5px;
  color:var(--navy);
}
.sidebar-sub{
  font-size:12px;
  color:var(--muted);
  margin-bottom:17px;
  font-weight:600;
}
.question-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.q-dot{
  height:38px;
  border-radius:10px;
  border:1px solid #D7E8E6;
  background:#FAFCFC;
  color:#617A80;
  font-family:var(--font-en);
  font-size:13px;
  font-weight:800;
  transition:.18s;
}
.q-dot:hover{border-color:var(--teal);transform:translateY(-1px)}
.q-dot.done{
  background:#DDF5EE;
  color:#087F6D;
  border-color:#A9E2D4;
}
.q-dot.current{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}
.q-dot.flagged{
  outline:2px solid var(--amber);
  outline-offset:-2px;
}
.legend{display:grid;gap:9px;margin-top:19px}
.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}
.legend-dot{
  width:9px;height:9px;
  border-radius:3px;
  background:#E0E9EA;
}
.legend-dot.green{background:#A9E2D4}
.legend-dot.dark{background:var(--navy)}
.legend-dot.amber{background:var(--amber)}

/* BUTTONS */
.exam-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:20px;
}
.action-group{display:flex;gap:9px}
.btn{
  border:0;
  border-radius:11px;
  padding:12px 20px;
  min-height:48px;
  font-size:14px;
  font-weight:800;
  transition:.2s;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-light{
  background:white;
  border:1px solid #DDE7E9;
  color:#294C55;
}
.btn-primary{background:var(--navy);color:white}
.btn-primary:hover{background:var(--navy2)}
.btn-submit{background:var(--red);color:white}
.btn-submit:hover{background:#C83E4E}
.exam-warning{
  font-size:12px;
  color:#7B9297;
  text-align:center;
  margin:20px 0 35px;
  font-weight:600;
}

/* RESUME BANNER */
.resume-banner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  background:linear-gradient(120deg,#FFF8E1,#FFF4D6);
  border:1px solid #F2C94C;
  border-radius:16px;
  padding:16px 20px;
  margin:18px 0;
  box-shadow:0 8px 24px rgba(242,201,76,.15);
}
.resume-banner strong{display:block;color:#7A5E00;font-size:15px;font-weight:800}
.resume-banner span{display:block;color:#8A6D00;font-size:12px;font-weight:600;margin-top:3px}
.resume-actions{display:flex;gap:8px}

/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(7,31,43,.55);
  backdrop-filter:blur(6px);
  display:grid;place-items:center;
  z-index:200;
  padding:20px;
}
.modal-backdrop[hidden]{display:none}
.modal{
  background:white;
  border-radius:20px;
  padding:28px;
  max-width:440px;
  width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  text-align:center;
}
.modal h3{margin:0 0 18px;color:var(--navy);font-size:20px;font-weight:800}
.modal-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin:16px 0 18px;
}
.modal-stats > div{
  background:#F3FAF8;border:1px solid #DCEFEB;border-radius:12px;padding:12px 6px;
}
.modal-stats b{display:block;font-size:22px;color:var(--navy);font-weight:800}
.modal-stats span{font-size:11px;color:var(--muted);font-weight:700}
.modal p{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 18px}
.modal-actions{display:flex;gap:10px;justify-content:center}
.modal-actions .btn{flex:1}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#071F2B;color:#fff;padding:12px 22px;border-radius:10px;
  font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:999;animation:toastIn .3s ease;max-width:calc(100% - 40px);text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* RESULTS */
.result-card{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:35px;
  box-shadow:var(--shadow);
  margin:25px 0 45px;
}
.result-heading{text-align:center;padding:15px 0 25px}
.result-kicker{
  font-family:var(--font-en);
  font-size:10px;
  font-weight:800;
  color:var(--teal-dark);
  letter-spacing:2px;
  direction:ltr;
}
.result-heading h2{
  font-size:30px;
  font-weight:800;
  margin:12px 0 5px;
  color:var(--navy);
}
.result-heading p{
  font-size:15px;
  color:var(--muted);
  font-weight:600;
}

.grade-badge{
  display:inline-grid;
  place-items:center;
  min-width:74px;height:74px;
  border-radius:20px;
  background:var(--teal-dark);
  color:white;
  font-family:var(--font-en);
  font-size:34px;
  font-weight:800;
  margin:12px auto 8px;
  box-shadow:0 10px 24px rgba(7,31,43,.15);
}

.score-circle{
  width:155px;height:155px;
  margin:22px auto;
  border-radius:50%;
  background:conic-gradient(var(--teal) var(--score),#E8EFF0 0);
  position:relative;
  display:grid;
  place-items:center;
  box-shadow:0 0 0 7px #E9F8F5,0 0 28px rgba(18,184,166,.15);
}
.score-circle:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  background:white;
}
.score-value{
  position:relative;
  z-index:1;
  font-size:38px;
  font-weight:800;
  color:var(--navy);
}
.score-sub{
  font-size:14px;color:var(--muted);font-weight:700;margin-top:6px;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  max-width:750px;
  margin:20px auto;
}
.result-stat{
  background:#F3FAF8;
  border:1px solid #DCEFEB;
  border-radius:14px;
  padding:18px 10px;
  text-align:center;
}
.result-stat b{
  display:block;
  font-size:26px;
  font-weight:800;
  color:var(--navy);
}
.result-stat span{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}

.section-title{
  font-size:19px;font-weight:800;color:var(--navy);
  margin:30px 0 14px;padding-top:22px;border-top:1px solid var(--line);
}

.category-breakdown{display:grid;gap:12px;margin:0 0 22px}
.cat-row{background:#F8FCFB;border:1px solid #E2F0EC;border-radius:12px;padding:14px}
.cat-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;gap:10px;flex-wrap:wrap}
.cat-head span{font-weight:700;color:var(--ink)}
.cat-head b{font-family:var(--font-en);font-size:13px;color:var(--muted);font-weight:800}
.cat-bar{height:8px;background:#E8EFF0;border-radius:6px;overflow:hidden}
.cat-bar > div{height:100%;border-radius:6px;background:#12B8A6;transition:width .6s ease}
.cat-row.good .cat-bar > div{background:var(--green)}
.cat-row.ok .cat-bar > div{background:var(--amber)}
.cat-row.weak .cat-bar > div{background:var(--red)}

.result-actions{text-align:center;margin:25px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review{border-top:1px solid var(--line);padding-top:25px}
.review h3{
  font-size:21px;
  font-weight:800;
  margin:0 0 17px;
  color:var(--navy);
}
.review-item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin:12px 0;
  background:#FCFDFD;
}
.review-question{
  font-weight:800;
  font-size:16px;
  line-height:2;
  margin-bottom:12px;
  color:var(--navy);
}
.review-answer{
  font-size:14px;
  line-height:2;
  margin:5px 0;
  font-weight:600;
}
.correct{color:var(--green);font-weight:800}
.wrong{color:var(--red);font-weight:800}
.explanation{
  border-top:1px dashed #DCE7E8;
  padding-top:10px;
  margin-top:10px;
  font-size:14px;
  font-weight:500;
  line-height:2;
  color:#526F77;
}
.footer{
  text-align:center;
  color:#81969A;
  font-size:12px;
  font-weight:600;
  padding:15px 0 30px;
}

/* شاشة الحماية */
.security-shield{
  position:fixed;inset:0;background:rgba(7,31,43,.98);
  z-index:9999;display:none;place-items:center;
  color:white;text-align:center;padding:30px;
}
.security-shield.active{display:grid}
.security-shield h2{font-size:24px;margin:0 0 10px}
.security-shield p{font-size:14px;color:#C0D5D8;max-width:420px;margin:0 auto}

/* TABLET */
@media(max-width:900px){
  .hero{
    padding:42px 35px;
    grid-template-columns:minmax(0,1fr) minmax(220px,.7fr);

  .exam-layout{grid-template-columns:1fr}
  .exam-sidebar{order:2}
  .question-grid{grid-template-columns:repeat(8,1fr)}
  .timer{font-size:80px}
}
